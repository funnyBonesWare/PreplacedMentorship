<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntersectionObserver Demo</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }
      .spacer { height: 60vh; }
      .box {
        height: 300px;
        margin: 50px;
        background: lightgray;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        transition: background-color 0.3s ease;
      }
      .box.in-view { background: lightgreen; }
    </style>
  </head>
  <body>
    <h1 style="text-align:center; margin: 24px 0;">IntersectionObserver Example</h1>
    <p style="text-align:center; margin: 0 16px 24px;">Scroll to see boxes turn green when entering the viewport.</p>

    <div class="spacer"></div>

    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>

    <div class="spacer"></div>

    <script>
      const boxes = document.querySelectorAll('.box');

      const observer = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
          } else {
            entry.target.classList.remove('in-view');
          }
        }
      }, { threshold: 0.3 });

      boxes.forEach((box) => observer.observe(box));
    </script>
  </body>
  </html>
